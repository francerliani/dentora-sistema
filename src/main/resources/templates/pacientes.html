<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dentora - Pacientes</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>

  <body>
    <div class="layout">
      <!-- ================= MENÚ LATERAL ================= -->
      <aside th:replace="~{fragmentos :: menu('pacientes')}"></aside>

      <!-- ================= CONTENIDO ================= -->
      <div class="contenido">
        <header th:replace="~{fragmentos :: barra}"></header>

        <main class="area-principal">
          <h1>Pacientes</h1>

            <!-- Aparece una sola vez, después de guardar -->
            <p class="mensaje-exito" th:if="${mensaje}" th:text="${mensaje}">Guardado</p>
            <p class="mensaje-error" th:if="${error}" th:text="${error}">Error</p>
          <section class="tarjeta">
            <div class="barra-acciones">
              <!-- Buscador a la izquierda, botón de alta a la derecha -->

              <form class="buscador" action="/pacientes" method="get">
                <!-- method="get": el texto buscado viaja en la dirección
                                 (ej: /pacientes?buscar=gonzalez). No es secreto,
                                 y así la búsqueda se puede recargar o compartir -->
                <input
                  type="text"
                  name="buscar"
                  th:value="${buscar}"
                  placeholder="Buscar por DNI o apellido"
                />
                                <!-- Filtro por obra social. th:selected deja marcada la que se eligió -->
                <select name="obra">
                  <option value="">Todas las obras sociales</option>
                  <option value="particular" th:selected="${obra == 'particular'}">Particular</option>
                  <option th:each="os : ${obrasSociales}"
                          th:value="${os.idObraSocial}"
                          th:text="${os.nombre}"
                          th:selected="${obra == #strings.toString(os.idObraSocial)}">OSDE</option>
                </select>

                <button type="submit" class="boton-principal">Buscar</button>
              </form>

              <a href="/pacientes/nuevo" class="boton-principal">+ Nuevo paciente</a>
              
              <!-- Enlace con aspecto de botón: su función es IR a otra página.
                             Regla práctica: si navega, es <a>; si ejecuta una acción, es <button> -->
            </div>

            <table>
              <thead>
                <tr>
                  <th>DNI</th>
                  <th>Apellido y nombre</th>
                  <th>Teléfono</th>
                  <th>Obra social</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <!-- Se repite una fila por cada paciente que mandó el controlador -->
                <tr th:each="p : ${pacientes}">
                  <td th:text="${p.dni}">30111222</td>
                  <td th:text="|${p.apellido}, ${p.nombre}|">
                    González, María
                  </td>
                  <td th:text="${p.telefono}">342-555555</td>
                  <!-- Si no tiene obra social (null), muestra "Particular" -->
                  <td
                    th:text="${p.obraSocial != null} ? ${p.obraSocial.nombre} : 'Particular'"
                  >
                    OSDE
                  </td>
                  <td>
                    <a th:href="@{/pacientes/editar/{id}(id=${p.idPaciente})}" class="boton-chico">Editar</a>
                    <form th:action="@{/pacientes/baja/{id}(id=${p.idPaciente})}" method="post" style="display:inline">
                    <button type="submit" class="boton-chico boton-peligro"
                     onclick="return confirm('¿Dar de baja a este paciente?')">Dar de baja</button>
                     </form>
                    </td>
                </tr>

                <!-- Solo aparece si la lista vino vacía -->
                <tr th:if="${#lists.isEmpty(pacientes)}">
                  <td colspan="5">No se encontraron pacientes.</td>
                </tr>
              </tbody>
            </table>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
