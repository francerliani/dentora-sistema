<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dentora - Inicio</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
    <div class="layout">

        <!-- Menú lateral: sale de fragmentos.html -->
        <aside th:replace="~{fragmentos :: menu('inicio')}"></aside>

        <div class="contenido">

            <!-- Barra superior: sale de fragmentos.html -->
            <header th:replace="~{fragmentos :: barra}"></header>

            <main class="area-principal">
                <h1 th:text="|Hola, ${primerNombre}|">Hola, Carlos</h1>
                <p>Este es el resumen del día.</p>

                <section class="tarjeta">
                    <h2>Turnos de hoy</h2>

                    <table>
                        <thead>
                            <tr>
                                <th>Hora</th>
                                <th>Paciente</th>
                                <th>Odontólogo</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- CAMBIO: una fila por cada turno de hoy que mandó el controlador
                                 (el odontólogo ve solo los suyos; secretaria y admin, todos) -->
                            <tr th:each="t : ${turnosHoy}">
                                <td th:text="${#temporals.format(t.hora, 'HH:mm')}">09:00</td>
                                <td th:text="|${t.paciente.nombre} ${t.paciente.apellido}|">María González</td>
                                <td th:text="${t.odontologo.nombre}">Juan Gaite</td>
                                <td>
                                    <!-- La clase del color sale del nombre del estado:
                                         Pendiente → estado-pendiente, Atendido → estado-atendido -->
                                    <span class="estado"
                                          th:classappend="${'estado-' + #strings.toLowerCase(t.estado.nombre)}"
                                          th:text="${t.estado.nombre}">Pendiente</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(turnosHoy)}">
                                <td colspan="4">No hay turnos para hoy.</td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </main>

        </div>
    </div>
</body>
</html>
