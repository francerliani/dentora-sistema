<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dentora - Inicio</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
    <!-- Sin class="pagina-login": esta página NO se centra -->

    <div class="layout">
        <!-- Contenedor general: pone el menú y el contenido uno al lado del otro -->

                <!-- ================= MENÚ LATERAL ================= -->
       <aside th:replace="~{fragmentos :: menu('inicio')}"></aside>

        <!-- ================= CONTENIDO ================= -->
        <div class="contenido">

            <header th:replace="~{fragmentos :: barra}"></header>
            

            <main class="area-principal">
                <h1 th:text="|Hola, ${primerNombre}|">Hola, Carlos</h1>
                <p>Este es el resumen del día.</p>

                <section class="tarjeta">
                    <!-- <section> = bloque temático dentro de la página -->
                    <h2>Turnos de hoy</h2>

                    <table>
                        <!-- Tabla de datos. <thead> = encabezados, <tbody> = filas de datos -->
                        <thead>
                            <tr>
                                <!-- <tr> = fila, <th> = celda de encabezado -->
                                <th>Hora</th>
                                <th>Paciente</th>
                                <th>Odontólogo</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <!-- <td> = celda de dato. Datos inventados para la maqueta -->
                                <td>09:00</td>
                                <td>María González</td>
                                <td>Dr. Juan Gaite</td>
                                <td><span class="estado estado-atendido">Atendido</span></td>
                            </tr>
                            <tr>
                                <td>10:30</td>
                                <td>Lucas Fernández</td>
                                <td>Dr. Juan Gaite</td>
                                <td><span class="estado estado-pendiente">Pendiente</span></td>
                            </tr>
                            <tr>
                                <td>11:15</td>
                                <td>Ana Rodríguez</td>
                                <td>Dra. Laura Méndez</td>
                                <td><span class="estado estado-cancelado">Cancelado</span></td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </main>

        </div>
    </div>
</body>
</html>
