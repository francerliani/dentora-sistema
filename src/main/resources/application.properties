spring.application.name=dentora

# ===== Conexión a PostgreSQL =====
# localhost:5432 = PostgreSQL en tu propia PC, puerto por defecto
# /dentora = el nombre de la base que acabás de crear
spring.datasource.url=jdbc:postgresql://localhost:5432/dentora
# Carga el usuario y la contraseña desde un archivo aparte que no se sube a GitHub
spring.config.import=optional:classpath:secretos.properties

# ===== JPA (Hibernate) =====
# update = crea o actualiza las tablas automáticamente según tus clases Java
spring.jpa.hibernate.ddl-auto=update
# muestra en la consola las consultas SQL que se ejecutan
spring.jpa.show-sql=true

# Formato de fechas de los formularios: año-mes-día (el que usa input type="date")
spring.mvc.format.date=iso